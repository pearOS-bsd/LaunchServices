name: check
on: [push, pull_request]
jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -f Makefile.lsd check
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -f Makefile.lsd build/lsd
  launchservicesd:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -f Makefile.lsd build/launchservicesd && clang -Wall test/lsvd_check.c -o build/lsvd_check
      - name: test job (user domain, service com.pearos.t.lsd) and the checks against it
        run: |
          mkdir -p ~/Library/LaunchAgents && sed "s|@PROGRAM@|$PWD/build/launchservicesd|" test/launchd/com.pearos.t.lsd.plist > ~/Library/LaunchAgents/com.pearos.t.lsd.plist
          launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.pearos.t.lsd.plist || launchctl load ~/Library/LaunchAgents/com.pearos.t.lsd.plist
          __LSXPCSERVICENAME=com.pearos.t.lsd build/lsvd_check
      - name: the same checks against the runner's own launchservicesd (the reference is macOS 26.7.2; other versions may differ)
        continue-on-error: true
        run: build/lsvd_check
      - name: daemon log
        if: always()
        run: tail -50 /tmp/lsvd-test.err || true
  liblaunchservicessupport:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build (x86_64)
        run: sh libLaunchServicesSupport/build-mac.sh out
      - name: exports are Apple's 78
        run: |
          nm -gU -j out/libLaunchServicesSupport.dylib | sort > got.txt
          sort libLaunchServicesSupport/exports.txt | diff - got.txt
          otool -D out/libLaunchServicesSupport.dylib | grep -x /usr/lib/libLaunchServicesSupport.dylib
      - name: compare with the runner's Apple dylib (x86_64 under Rosetta; the reference is macOS 26.7.2, other versions may differ)
        continue-on-error: true
        run: |
          cp out/libLaunchServicesSupport.dylib out/ours-test.dylib
          install_name_tool -id /tmp/lsss-ours-test.dylib out/ours-test.dylib && codesign -f -s - out/ours-test.dylib
          clang++ -arch x86_64 -std=gnu++20 -fobjc-arc test/lsss_check.mm -framework Foundation -framework AppKit -framework CoreServices -framework Security -o out/lsss_check
          arch -x86_64 out/lsss_check /usr/lib/libLaunchServicesSupport.dylib $PWD/out/ours-test.dylib
